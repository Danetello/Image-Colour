# Recolour profiles. Run `python main.py --list` to see them, `python main.py <name>` to render one.
#
# How a texture is built
# ----------------------
# Every pixel of the CC texture (Textures/CC/*_cc) falls into one of five channels:
#   red   - mostly red pixels      (main armour)
#   green - mostly green pixels    (decals / chapter logo)
#   blue  - mostly blue pixels     (trims and everything else)
#   white - pure white (255,255,255)
#   black - pure black (0,0,0)
#
# Each channel is set to one of:
#   "keep"           - copy the pixel from the base texture unchanged
#   "grey"           - copy the pixel from the grey texture
#   "<preset name>"  - use a channel definition from [presets]
#   { colour = ... } - recolour, using the grey texture for shading:
#
#       colour      = [r, g, b] or a name from [colours]. This is exactly what flat, undamaged paint
#                     will look like, so pick it with a colour picker and you're done.
#       detail      = 1.0  How strongly the grey texture's shading shows through (0 = flat colour).
#       highlights  = 1.0  How far scratches / worn edges may lighten the colour.
#       shadows     = 1.0  How far grime / crevices may darken the colour.
#       cc_strength = true Paint less where the CC colour is faint, like the game does, so scratches
#                          and worn edges show the grey texture. false paints the whole part evenly.
#       reference   = "auto" (default) or 0-1. The grey lightness that maps to exactly `colour`;
#                     "auto" uses the typical (median) grey value of that region.
#
#     1.0 for detail / highlights / shadows matches the shading of the original Ultramarine textures.
#     Shading is applied to lightness only, and is limited by how much room the colour has, so very
#     dark or very light colours keep their detail rather than clipping to black or white.
#     Metal needs more contrast than paint: see the gold_trim preset and the Black Templar silver.
#
#     method = "legacy" switches to the original formula (colour * (1 - grey)) for that channel,
#     which takes flip_below / lift / lift_mode instead (see profiles.salamanders_legacy).
#
# Inheritance
# -----------
# Every profile starts from [defaults]. A profile can also `extends = "other_profile"`.
# Channel settings merge field by field, so a profile only lists what differs,
# e.g. `red = { colour = "blood_angel_red" }` keeps any inherited detail / highlights / shadows.
#
# Experimental profiles
# ---------------------
# `experimental = true` marks a profile that hasn't been checked against finished textures.
# The app lists it as experimental. It isn't inherited through `extends`.
#
# Which profile a texture needs
# -----------------------------
# Each team has a main profile and variants for parts that differ; the finished textures decide which.
# tests/check_dev_example.py lists the profile of every texture of the example sets.
#   *_gold_trim       - the base texture has no gold yet (it's the grey texture), so the trims are painted gold
#   *_grey_trim       - trims stay as in the grey texture, e.g. the Vanity parts
#   *_black           - black paint, for parts such as shoulder pads, backpacks and caps
#   *_grey_unpainted  - unpainted parts (black in the CC) come from the grey texture instead of the base
#   *_<part>          - parts that are unique per set, such as officer shoulders and helmets

[colours]
ultramarine_blue = [52, 67, 107]  # measured from 35 original game textures
salamander_green = [7, 73, 22]  # measured from the Salamander finals
salamander_black = [16, 16, 16]
templar_black = [16, 16, 16]  # measured from the Black Templar finals
templar_trim_black = [20, 20, 20]
templar_silver = [122, 122, 122]
templar_pad_white = [159, 159, 159]
salamander_trim_black = [20, 20, 20]
decal_light = [151, 151, 151]
decal_red = [102, 11, 11]
metal_gold = [177, 140, 94]  # measured from 17 original game textures
# Experimental colours
salamander_green_dark = [0, 51, 22]
imperial_fist_yellow = [181, 138, 24]
blood_angel_red = [108, 12, 15]
templar_white = [200, 200, 200]
decal_dark = [13, 13, 13]

[presets]
gold_trim = { colour = "metal_gold", highlights = 3.0, shadows = 1.7 }  # fitted to the original game textures

[defaults]
green = { colour = "decal_light" }
white = { colour = "decal_red" }
blue = "keep"
black = "keep"


# Ultramarines, made from the grey and CC textures only

[profiles.ultramarines]
description = "Ultramarine blue armour, gold trims, white decals"
red = { colour = "ultramarine_blue" }
blue = "gold_trim"
black = "grey"

[profiles.ultramarines_grey_trim]
description = "Ultramarine blue armour, trims as in the grey texture, e.g. Vanity parts"
extends = "ultramarines"
blue = "grey"

[profiles.ultramarines_officer_shoulders]
description = "Ultramarine officer shoulders: the gold is already in the grey texture"
extends = "ultramarines"
blue = "grey"


# Salamanders

[profiles.salamanders]
description = "Salamander green armour, white decals"
red = { colour = "salamander_green" }

[profiles.salamanders_gold_trim]
description = "Salamander green armour with painted gold trims, for textures without gold in the base"
extends = "salamanders"
blue = "gold_trim"

[profiles.salamanders_black]
description = "Salamander black parts: shoulder pads, backpacks, caps"
extends = "salamanders"
red = { colour = "salamander_black" }

[profiles.salamanders_black_gold_trim]
description = "Salamander black parts with painted gold trims"
extends = "salamanders_black"
blue = "gold_trim"

[profiles.salamanders_grey_unpainted]
description = "Salamander green armour, unpainted parts from the grey texture"
extends = "salamanders"
black = "grey"

[profiles.salamanders_black_grey_unpainted]
description = "Salamander black parts, unpainted parts from the grey texture"
extends = "salamanders_black"
black = "grey"

[profiles.salamanders_soldier_shoulders]
description = "Salamander Soldier shoulder pads: black, with the unpainted parts painted black too"
extends = "salamanders_black"
black = { colour = "salamander_trim_black" }

[profiles.salamanders_officer_shoulders]
description = "Salamander officer shoulders: green with grey decals, gold kept"
extends = "salamanders"
green = { colour = [143, 143, 143] }

[profiles.salamanders_soldier_helmet]
description = "Salamander Soldier helmet: green with a black stripe"
extends = "salamanders"
green = { colour = "salamander_black" }
blue = { colour = [133, 133, 133] }

[profiles.salamanders_sailor_helmet]
description = "Salamander Sailor helmet: lighter green, painted gold trims"
extends = "salamanders_gold_trim"
red = { colour = [8, 82, 25] }

[profiles.salamanders_paratrooper_helmet]
description = "Salamander Paratrooper helmet: darker green, painted gold trims"
extends = "salamanders_gold_trim"
red = { colour = [7, 60, 18] }


# Black Templars

[profiles.black_templars]
description = "Black Templar armour: black with silver trims, white decals"
red = { colour = "templar_black" }
blue = { colour = "templar_silver", detail = 2.0, highlights = 3.0, shadows = 3.0 }  # metal needs more contrast than paint
black = "grey"

[profiles.black_templars_shoulders]
description = "Black Templar shoulder pads: white with black trims and decals"
extends = "black_templars"
red = { colour = "templar_pad_white" }
green = { colour = "templar_black" }
blue = { colour = "templar_black" }

[profiles.black_templars_all_black]
description = "Black Templar parts that are black all over, like boots and trims"
extends = "black_templars"
red = { colour = "templar_trim_black" }
blue = { colour = "templar_trim_black" }
black = { colour = "templar_trim_black" }

[profiles.black_templars_scout_shoulders]
description = "Black Templar Scout shoulder pads: like the other shoulder pads, unpainted parts flat grey"
extends = "black_templars_shoulders"
black = { colour = [113, 113, 113] }

[profiles.black_templars_officer_shoulders]
description = "Black Templar officer shoulders: white with dark grey decals, gold kept"
extends = "black_templars_shoulders"
green = { colour = [32, 32, 32] }
blue = "keep"

[profiles.black_templars_engineer_skirt]
description = "Black Templar engineer skirt: black, red cloth kept"
extends = "black_templars"
red = { colour = "templar_trim_black" }
blue = "keep"


# Experimental

[profiles.salamanders_dark]
description = "Darker Salamander green"
experimental = true
red = { colour = "salamander_green_dark" }

[profiles.imperial_fists]
description = "Imperial Fists yellow"
experimental = true
red = { colour = "imperial_fist_yellow" }

[profiles.blood_angels]
description = "Blood Angels red"
experimental = true
red = { colour = "blood_angel_red" }

[profiles.templars_light]
description = "White armour, black decals"
experimental = true
red = { colour = "templar_white" }
green = { colour = "decal_dark" }

# The original algorithm and tuning, kept for comparison. Reproduces the old output exactly.
[profiles.salamanders_legacy]
description = "Original formula and lift rules (old Salamanders output)"
experimental = true
red = { method = "legacy", colour = [10, 100, 30], lift = [
    { below = 10, add = 0 },
    { below = 160, add = 1 },
] }
green = { method = "legacy", colour = [220, 220, 220], flip_below = 100 }
white = { method = "legacy", colour = [145, 15, 15], flip_below = 100 }
